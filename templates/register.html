{% extends 'base.html' %}

{% block title %}會員註冊 - 寵物陪伴刊登平台{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>建立新帳號</h2>
        <form method="post">
            <div class="form-group">
                <label for="email">電子信箱 (帳號)</label>
                <input type="email" id="email" name="email" class="form-control" required
                    placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" class="form-control" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">確認密碼</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="name">真實姓名</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="nickname">暱稱</label>
                <input type="text" id="nickname" name="nickname" class="form-control">
            </div>

            <div class="form-group">
                <label>性別</label>
                <div class="gender-group">
                    <label class="gender-option">
                        <input type="radio" name="gender" value="male" required> 生理男
                    </label>
                    <label class="gender-option">
                        <input type="radio" name="gender" value="female"> 生理女
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="dob">出生年月日</label>
                <input type="date" id="dob" name="dob" class="form-control" required>
            </div>

            <div class="form-group">
                <label>居住地區</label>
                <div style="display: flex; gap: 10px;">
                    <select id="city" name="city" class="form-control" required>

                    </select>
                    <select id="district" name="district" class="form-control" required>

            </div>

                const districtSelect = document.getElementById('district');

                // Populate cities
                for (const city in taiwanPlaces) {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                }

                // Handle city change
                citySelect.addEventListener('change', function () {
                    const selectedCity = this.value;
                    districtSelect.innerHTML = '<option value="">請選擇鄉鎮市區</option>'; // Reset districts

                    if (selectedCity && taiwanPlaces[selectedCity]) {
                        taiwanPlaces[selectedCity].forEach(district => {
                            const option = document.createElement('option');
                            option.value = district;
                            option.textContent = district;
                            districtSelect.appendChild(option);
                        });
                    }
                });

            <div class="form-group">

            </div>

            <button type="button" id="registerBtn" class="btn btn-primary btn-block">註冊</button>

            <div class="auth-footer">
                已經有帳號？ <a href="{{ url_for('auth.login') }}">直接登入</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('registerBtn').addEventListener('click', function () {
        const form = this.closest('form');

        // Check if form is valid
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        // Check password match
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        if (password !== confirmPassword) {
            Swal.fire({
                icon: 'error',
                title: '密碼不一致',
                text: '請確認兩次輸入的密碼相同'
            });
            return;
        }

        const email = document.getElementById('email').value;

        Swal.fire({
            title: '確定註冊帳號？',
            html: `
            <div style="text-align: left; padding: 10px;">
                <p><strong>電子信箱：</strong>${email}</p>
                <p style="margin-top: 10px; color: #666; font-size: 0.9rem;">
                    <i class="fas fa-info-circle"></i> 請確認資料正確，註冊後可在會員中心修改個人資料。
                </p>
            </div>
        `,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#3b82f6',
            cancelButtonColor: '#6b7280',
            confirmButtonText: '確定註冊',
            cancelButtonText: '返回修改'
        }).then((result) => {
            if (result.isConfirmed) {
                form.submit();
            }
        });
    });
</script>
